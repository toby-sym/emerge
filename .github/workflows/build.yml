name: Build & Validate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore -p:PublishReadyToRun=true

      - name: Build (all projects as Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run headless smoke test (Emerge.Experiments)
        run: dotnet run --project Emerge.Experiments --no-build --configuration Release