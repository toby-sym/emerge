name: Auto-Format on Push

on:
  push:

jobs:
  lint-and-fix:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (lint)
        run: dotnet build --no-restore -warnaserror

      - name: Fix C# formatting
        run: dotnet format --no-restore

      - name: Install & Fix XAML
        run: |
          dotnet tool install --global XamlStyler.Console
          if (-not (Test-Path .xstyler)) { 
            '{"IndentCharacters":"  ","IndentAttributes":false,"FormattingRules":["PutAttributeOnNewLine","PutAttributeOnItsOwnLineIfItHasAttributes"]}' | Out-File -Encoding utf8 .xstyler 
          }
          xstyler -c .xstyler -d .           # recursively process all .xaml files

      - name: Commit & Push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "style: auto-format [skip ci]"
            git push
          fi