name: Custom Simulation Run

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Random seed for the simulation'
        required: true
        default: '48192837'
        type: string
      ticks:
        description: 'Number of ticks to run'
        required: true
        default: '500'
        type: string

jobs:
  run-simulation:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore -p:PublishReadyToRun=true

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:PublishReadyToRun=true

      - name: Run custom simulation
        run: dotnet run --project Emerge.Experiments --no-build --configuration Release -- --seed ${{ inputs.seed }} --ticks ${{ inputs.ticks }}