name: Custom Simulation Run

on:
  push:
    branches:
      - '**'

jobs:
  run-simulation:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run custom simulation
        run: dotnet run --project Emerge.Experiments --no-build --configuration Release -- --seed ${{ inputs.seed }} --ticks ${{ inputs.ticks }}